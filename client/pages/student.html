<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Learning | Tutoring Center</title>
    <link rel="stylesheet" href="../assets/css/student.css" />
    <link rel="stylesheet" href="../assets/css/onlineClass.css" />
  </head>
  <body>
    <header class="student-topbar">
      <div class="student-brand">
        <div class="brand-mark">ML</div>
        <div>
          <strong>My Learning</strong>
          <span id="studentName">Student</span>
        </div>
      </div>
      <button id="logoutButton" class="logout-button" type="button">Logout</button>
      <button id="announcementButton" class="topbar-announcement-button" type="button" aria-label="Announcements" aria-expanded="false">
        <i data-lucide="megaphone"></i>
      </button>
      <div id="announcementPopover" class="announcement-popover hidden" aria-hidden="true"></div>
      <div id="studentAvatar" class="avatar">ST</div>
    </header>

    <nav class="student-nav" aria-label="Student navigation">
      <button class="nav-pill active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
      <button class="nav-pill" data-view="classes"><i data-lucide="book-open"></i>My Classes</button>
      <button class="nav-pill" data-view="schedule"><i data-lucide="calendar-days"></i>My Schedule</button>
      <button class="nav-pill" data-view="attendance"><i data-lucide="clipboard-check"></i>Attendance</button>
      <button class="nav-pill" data-view="scores"><i data-lucide="award"></i>Scores</button>
      <button class="nav-pill" data-view="assignments"><i data-lucide="file-text"></i>Assignments</button>
      <button class="nav-pill" data-view="materials"><i data-lucide="folder-open"></i>Materials</button>
      <button class="nav-pill" data-view="feedback"><i data-lucide="message-square"></i>Feedback</button>
      <button class="nav-pill" data-view="online"><i data-lucide="video"></i>Online Classes</button>
      <button class="nav-pill" data-view="profile"><i data-lucide="user-round"></i>Profile</button>
    </nav>

    <main class="student-main">
      <section class="page-heading">
        <h1 id="viewTitle">Welcome back</h1>
        <p id="viewSubtitle">Here's your learning overview</p>
      </section>

      <div id="statusMessage" class="status-message"></div>

      <section id="dashboardView" class="view active">
        <section class="daily-report-hero">
          <div>
            <span id="dailyReportDate">Today</span>
            <h2>Learning Briefing</h2>
            <p id="dailyReportSummary">Your daily learning report is ready.</p>
          </div>
          <div class="daily-report-mark"><i data-lucide="sparkles"></i></div>
        </section>

        <div class="metric-grid">
          <article class="metric-card blue-card">
            <div class="metric-label">Today's Classes</div>
            <strong id="metricClasses">0</strong>
          </article>
          <article class="metric-card green-card">
            <div class="metric-label">Latest Average</div>
            <strong id="metricAttendance">0%</strong>
          </article>
          <article class="metric-card purple-card">
            <div class="metric-label">Graded Work</div>
            <strong id="metricPaid">0</strong>
          </article>
          <article class="metric-card orange-card">
            <div class="metric-label">Pending Tasks</div>
            <strong id="metricUpcoming">0</strong>
          </article>
        </div>

        <div class="dashboard-grid">
          <article class="panel">
            <h2>Today's Classes</h2>
            <div id="upcomingClasses" class="stack-list"></div>
          </article>
          <article class="panel">
            <h2>Daily Scores & Tasks</h2>
            <div id="paymentList" class="stack-list"></div>
          </article>
        </div>
      </section>

      <section id="classesView" class="view"></section>
      <section id="scheduleView" class="view"></section>
      <section id="attendanceView" class="view"></section>
      <section id="scoresView" class="view"></section>
      <section id="assignmentsView" class="view"></section>
      <section id="materialsView" class="view"></section>
      <section id="feedbackView" class="view"></section>
      <section id="onlineView" class="view"></section>
      <section id="profileView" class="view"></section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../assets/js/onlineClass.js"></script>
    <script src="../assets/js/student.js"></script>
  </body>
</html>
