<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Dashboard | Tutoring Center</title>
    <link rel="stylesheet" href="../assets/css/parent.css" />
    <link rel="stylesheet" href="../assets/css/onlineClass.css" />
  </head>
  <body>
    <header class="parent-topbar">
      <div class="parent-brand">
        <div class="brand-mark">PD</div>
        <div>
          <strong>Parent Dashboard</strong>
          <span id="parentName">Parent</span>
        </div>
      </div>
      <button id="logoutButton" class="logout-button" type="button">Logout</button>
      <button id="announcementButton" class="topbar-announcement-button" type="button" aria-label="Announcements" aria-expanded="false">
        <i data-lucide="megaphone"></i>
      </button>
      <div id="announcementPopover" class="announcement-popover hidden" aria-hidden="true"></div>
      <div id="parentAvatar" class="avatar">PA</div>
    </header>

    <main class="parent-main">
      <nav class="parent-nav" aria-label="Parent navigation">
        <button class="nav-card active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
        <button class="nav-card" data-view="children"><i data-lucide="users"></i>My Children</button>
        <button class="nav-card" data-view="schedule"><i data-lucide="calendar-days"></i>Child Schedule</button>
        <button class="nav-card" data-view="attendance"><i data-lucide="clipboard-check"></i>Attendance</button>
        <button class="nav-card" data-view="feedback"><i data-lucide="message-square"></i>Teacher Feedback</button>
        <button class="nav-card" data-view="online"><i data-lucide="video"></i>Online Classes</button>
        <button class="nav-card" data-view="payments"><i data-lucide="credit-card"></i>Payment Status</button>
        <button class="nav-card" data-view="profile"><i data-lucide="user-round"></i>Profile</button>
      </nav>

      <section class="content-card">
        <div class="page-heading">
          <h1 id="viewTitle">Parent Dashboard</h1>
          <p id="viewSubtitle">Overview of your children's learning</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <section id="dashboardView" class="view active">
          <section class="daily-report-hero">
            <div>
              <span id="dailyReportDate">Today</span>
              <h2>Family Briefing</h2>
              <p id="dailyReportSummary">Your daily family learning report is ready.</p>
            </div>
            <div class="daily-report-mark"><i data-lucide="sparkles"></i></div>
          </section>

          <div class="metric-grid">
            <article class="metric-card">
              <span>Classes Today</span>
              <strong id="metricChildren">0</strong>
            </article>
            <article class="metric-card">
              <span>Feedback Sent</span>
              <strong id="metricFeedback">0</strong>
            </article>
            <article class="metric-card">
              <span>Attendance Today</span>
              <strong id="metricAttendance">0%</strong>
            </article>
            <article class="metric-card">
              <span>Open Payments</span>
              <strong id="metricUnpaid">0</strong>
            </article>
          </div>

          <div class="dashboard-grid">
            <article class="panel">
              <h2>Today's Child Classes</h2>
              <div id="schedulePreview" class="stack-list"></div>
            </article>
            <article class="panel">
              <h2>Family Updates</h2>
              <div id="paymentPreview" class="stack-list"></div>
            </article>
          </div>
        </section>

        <section id="childrenView" class="view"></section>
        <section id="scheduleView" class="view"></section>
        <section id="attendanceView" class="view"></section>
        <section id="feedbackView" class="view"></section>
        <section id="onlineView" class="view"></section>
        <section id="paymentsView" class="view"></section>
        <section id="profileView" class="view"></section>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../assets/js/onlineClass.js"></script>
    <script src="../assets/js/parent.js"></script>
  </body>
</html>
